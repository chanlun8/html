<html>
<meta charset='utf-8'>
<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.15/css/jquery.dataTables.min.css">
<script type="text/javascript" src="//code.jquery.com/jquery-1.12.4.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.10.15/js/jquery.dataTables.min.js"></script>
<body>
<div>2026-07-16</div>
<table id="example" class="display" cellspacing="0" width="100%">
<thead><tr><th></th><th>code</th><th>name</th><th>frequency</th><th>bi_mmd</th><th>bi_mmd_time</th><th>bi_mmd_high</th><th>bi_mmd_low</th><th>xd_mmd</th><th>xd_mmd_time</th><th>xd_mmd_high</th><th>xd_mmd_low</th></tr></thead>
<tbody></tbody>
</table>
<script src="index_ext_data.js"></script>
<script>
$(document).ready(function() {
    $('#example').dataTable( {
        "dom": '<"top"i>rt<"bottom"flp><"clear">',
        "data": INDEX_EXT_DATA,
        "iDisplayLength": 20,
        "deferRender": true,
        "order": []
    } );
    var table=$("#example").DataTable();
    $("#example").on("click","tr",function(){
      var data=table.row(this).data();
      code = data[1].replace(/#/g, "-");
      window.open("/" + code + "_day.html", '_blank', '');
    });
});
</script>
</body>
</html>
